name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JSON files parse
        run: |
          for f in definitions/definitions.json checks/checks.json test-vectors/classified-payments.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" && echo "ok $f"
          done

      - name: Fixtures recount and every row passes
        run: |
          shopt -s nullglob
          for f in fixtures/*.csv; do
            node fixtures/check-fixture.mjs "$f"
          done

      - name: Relative links resolve
        run: node scripts/check-links.mjs
